name: AI Risk Assessment

on:
  pull_request:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  ai-risk-assessment:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run AI Risk Assessment
        shell: bash
        run: |
          cat > ai_risk_assessment.py <<'PY'
          import os
          import re
          import json
          from pathlib import Path

          AI_LIBRARIES = [
              "openai", "anthropic", "google-generativeai", "azureopenai",
              "bedrock", "ollama", "huggingface", "transformers",
              "langchain", "langgraph", "llama-index", "crewai", "autogen",
              "semantic-kernel", "spring-ai", "langchain4j", "mcp",
              "@modelcontextprotocol"
          ]

          RISK_PATTERNS = {
              "AIR-001 Shadow AI": {
                  "severity": "High",
                  "category": "Governance",
                  "patterns": [r"\bopenai\b", r"\banthropic\b", r"\bgemini\b", r"\bbedrock\b", r"\bollama\b", r"\blangchain\b", r"\bcrewai\b", r"\bautogen\b"],
                  "description": "Indício de uso de IA sem evidência clara de governança ou aprovação formal."
              },
              "AIR-002 Prompt Injection": {
                  "severity": "High",
                  "category": "Prompt Security",
                  "patterns": [r"system_prompt", r"user_prompt", r"prompt\s*=", r"You are a", r"Act as"],
                  "description": "Prompts em código podem ampliar risco de prompt injection e manipulação de comportamento."
              },
              "AIR-003 Jailbreak Exposure": {
                  "severity": "Medium",
                  "category": "Prompt Security",
                  "patterns": [r"jailbreak", r"ignore all previous", r"bypass", r"developer mode"],
                  "description": "Indícios de padrões associados a jailbreak ou bypass de instruções."
              },
              "AIR-004 Excessive Agency": {
                  "severity": "Critical",
                  "category": "Agent Security",
                  "patterns": [r"Agent\(", r"Assistant\(", r"Crew\(", r"Workflow\(", r"Task\(", r"tools\s*=", r"function_call", r"tool_call"],
                  "description": "Indício de agente ou workflow autônomo com possível tomada de ação."
              },
              "AIR-005 Tool Abuse": {
                  "severity": "Critical",
                  "category": "Agent Security",
                  "patterns": [r"os\.system", r"subprocess\.", r"exec\(", r"eval\(", r"write_file", r"delete_file", r"GitHubTool", r"JiraTool", r"DatabaseTool", r"AWSTool"],
                  "description": "Ferramentas sensíveis podem ser abusadas por agentes ou fluxos automatizados."
              },
              "AIR-006 Data Leakage": {
                  "severity": "High",
                  "category": "Data Protection",
                  "patterns": [r"\bcpf\b", r"\bcnpj\b", r"personal_data", r"customer_data", r"credit_card", r"\bpii\b"],
                  "description": "Possível uso de dados sensíveis em contexto de IA."
              },
              "AIR-007 AI Secrets Exposure": {
                  "severity": "High",
                  "category": "Secrets",
                  "patterns": [r"OPENAI_API_KEY", r"ANTHROPIC_API_KEY", r"GEMINI_API_KEY", r"AZURE_OPENAI_API_KEY", r"HUGGINGFACE_TOKEN", r"BEDROCK_API_KEY"],
                  "description": "Possível exposição de credencial ou variável sensível relacionada a IA."
              },
              "AIR-008 Vulnerable AI Dependencies": {
                  "severity": "Medium",
                  "category": "Supply Chain",
                  "patterns": [r"langchain", r"llama-index", r"crewai", r"autogen", r"semantic-kernel", r"transformers"],
                  "description": "Dependências de IA identificadas e que devem ser avaliadas por SCA."
              },
              "AIR-009 MCP Server Exposure": {
                  "severity": "High",
                  "category": "MCP Security",
                  "patterns": [r"mcp\.json", r"mcp-config\.json", r"mcp_server", r"MCPServer", r"from mcp", r"@modelcontextprotocol"],
                  "description": "Indício de MCP Server ou integração MCP no repositório."
              },
              "AIR-010 Vibe Coding Risk": {
                  "severity": "Medium",
                  "category": "AI Generated Code",
                  "patterns": [r"generated by chatgpt", r"generated with chatgpt", r"generated by claude", r"generated with claude", r"generated with cursor", r"generated by copilot", r"ai generated", r"vibe coding"],
                  "description": "Indício de código gerado por IA sem garantia de revisão segura."
              },
              "AIR-011 Lack of Human Oversight": {
                  "severity": "High",
                  "category": "Governance",
                  "patterns": [r"auto_approve", r"auto_execute", r"autonomous", r"without approval", r"skip_review", r"no human"],
                  "description": "Possível ausência de aprovação humana em ações automatizadas por IA."
              },
              "AIR-012 Insecure Output Handling": {
                  "severity": "High",
                  "category": "Application Security",
                  "patterns": [r"innerHTML", r"dangerouslySetInnerHTML", r"render\(response", r"eval\(response", r"exec\(response"],
                  "description": "Saída de IA pode estar sendo usada sem validação ou sanitização."
              }
          }

          IGNORE_DIRS = {
              ".git", "node_modules", "vendor", ".venv", "venv", "dist",
              "build", "__pycache__", ".next", ".terraform"
          }

          VALID_EXTENSIONS = {
              ".py", ".js", ".ts", ".tsx", ".jsx", ".java", ".go", ".rb",
              ".php", ".yaml", ".yml", ".json", ".xml", ".toml", ".txt",
              ".md", ".env", ".properties", ".gradle", ".cs", ".rs", ".sh",
              ".sql"
          }

          VALID_FILENAMES = {
              "requirements.txt", "package.json", "pom.xml", "go.mod",
              "Dockerfile", ".env", ".env.example"
          }

          findings = []
          ai_assets = set()

          def should_scan(path: Path) -> bool:
              normalized = str(path).replace("\\", "/")

              if normalized in [
                  ".github/workflows/risk.yml",
                  "github/workflows/risk.yml",
                  "./.github/workflows/risk.yml"
              ]:
                  return False

              if any(part in IGNORE_DIRS for part in path.parts):
                  return False

              return path.suffix.lower() in VALID_EXTENSIONS or path.name in VALID_FILENAMES

          def read_file(path: Path) -> str:
              try:
                  return path.read_text(errors="ignore")
              except Exception:
                  return ""

          def add_finding(risk_id, severity, category, file_path, evidence, description):
              findings.append({
                  "risk": risk_id,
                  "severity": severity,
                  "category": category,
                  "file": str(file_path),
                  "evidence": evidence[:300],
                  "description": description
              })

          for root, dirs, files in os.walk("."):
              dirs[:] = [d for d in dirs if d not in IGNORE_DIRS]

              for file_name in files:
                  path = Path(root) / file_name

                  if not should_scan(path):
                      continue

                  content = read_file(path)
                  content_lower = content.lower()

                  if any(lib.lower() in content_lower for lib in AI_LIBRARIES):
                      ai_assets.add(str(path))

                  for risk_id, rule in RISK_PATTERNS.items():
                      for pattern in rule["patterns"]:
                          if re.search(pattern, content, re.IGNORECASE):
                              add_finding(
                                  risk_id=risk_id,
                                  severity=rule["severity"],
                                  category=rule["category"],
                                  file_path=path,
                                  evidence=pattern,
                                  description=rule["description"]
                              )
                              break

          severity_weight = {
              "Critical": 25,
              "High": 15,
              "Medium": 8,
              "Low": 3
          }

          score = min(sum(severity_weight.get(f["severity"], 0) for f in findings), 100)

          if score >= 85:
              risk_level = "Critical"
          elif score >= 70:
              risk_level = "High"
          elif score >= 40:
              risk_level = "Medium"
          elif score > 0:
              risk_level = "Low"
          else:
              risk_level = "No AI Risk Detected"

          summary = {}

          for finding in findings:
              category = finding["category"]
              severity = finding["severity"]

              if category not in summary:
                  summary[category] = {
                      "total": 0,
                      "Critical": 0,
                      "High": 0,
                      "Medium": 0,
                      "Low": 0
                  }

              summary[category]["total"] += 1
              summary[category][severity] += 1

          report = {
              "assessment": "AI Risk Assessment",
              "assessment_type": "AI Risk Assessment as Code",
              "pipeline_blocking": False,
              "ai_adoption_detected": len(ai_assets) > 0,
              "ai_assets_count": len(ai_assets),
              "ai_assets": sorted(list(ai_assets)),
              "risk_score": score,
              "risk_level": risk_level,
              "findings_count": len(findings),
              "summary": summary,
              "findings": findings,
              "recommended_next_steps": [
                  "Validar se os usos de IA identificados estão aprovados formalmente.",
                  "Criar ou atualizar inventário de ativos com IA.",
                  "Revisar prompts, agentes, MCP Servers e integrações com LLMs.",
                  "Aplicar controles contra Prompt Injection, Tool Abuse e Excessive Agency.",
                  "Validar exposição de dados sensíveis em fluxos com IA.",
                  "Executar SAST, SCA e Secrets Scan nos ativos identificados.",
                  "Definir Human-in-the-Loop para ações sensíveis.",
                  "Criar monitoramento contínuo para riscos de IA em produção."
              ]
          }

          with open("ai-risk-assessment-report.json", "w", encoding="utf-8") as f:
              json.dump(report, f, indent=2, ensure_ascii=False)

          print(json.dumps(report, indent=2, ensure_ascii=False))
          print("AI Risk Assessment completed. Pipeline will not be blocked.")
          raise SystemExit(0)
          PY

          python3 ai_risk_assessment.py

      - name: Show AI Risk Assessment Summary
        shell: bash
        if: always()
        run: |
          echo "## AI Risk Assessment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ -f ai-risk-assessment-report.json ]; then
            echo "| Campo | Valor |" >> $GITHUB_STEP_SUMMARY
            echo "|---|---|" >> $GITHUB_STEP_SUMMARY
            echo "| AI Adoption Detected | $(jq -r '.ai_adoption_detected' ai-risk-assessment-report.json) |" >> $GITHUB_STEP_SUMMARY
            echo "| AI Assets Count | $(jq -r '.ai_assets_count' ai-risk-assessment-report.json) |" >> $GITHUB_STEP_SUMMARY
            echo "| Risk Score | $(jq -r '.risk_score' ai-risk-assessment-report.json) |" >> $GITHUB_STEP_SUMMARY
            echo "| Risk Level | $(jq -r '.risk_level' ai-risk-assessment-report.json) |" >> $GITHUB_STEP_SUMMARY
            echo "| Findings Count | $(jq -r '.findings_count' ai-risk-assessment-report.json) |" >> $GITHUB_STEP_SUMMARY

            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Findings" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "| Severidade | Categoria | Risco | Arquivo | Evidência |" >> $GITHUB_STEP_SUMMARY
            echo "|---|---|---|---|---|" >> $GITHUB_STEP_SUMMARY

            jq -r '.findings[] | "| \(.severity) | \(.category) | \(.risk) | `\(.file)` | `\(.evidence)` |"' ai-risk-assessment-report.json >> $GITHUB_STEP_SUMMARY
          else
            echo "Relatório não encontrado." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload AI Risk Assessment Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ai-risk-assessment-report
          path: ai-risk-assessment-report.json
